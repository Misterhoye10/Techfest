<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Diffusion diagram">
  <rect width="640" height="360" fill="#f7f5f1"/>
  <rect x="40" y="40" width="560" height="280" rx="20" fill="#fff" stroke="#e5e2df"/>
  <text x="180" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#6b7280">Before</text>
  <text x="460" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#6b7280">After</text>
  <circle cx="120" cy="160" r="10" fill="#225aeb"/><circle cx="150" cy="180" r="10" fill="#225aeb"/><circle cx="135" cy="200" r="10" fill="#225aeb"/><circle cx="165" cy="155" r="10" fill="#225aeb"/>
  <circle cx="420" cy="150" r="10" fill="#225aeb"/><circle cx="480" cy="170" r="10" fill="#225aeb"/><circle cx="450" cy="200" r="10" fill="#225aeb"/><circle cx="510" cy="155" r="10" fill="#225aeb"/><circle cx="440" cy="230" r="10" fill="#225aeb"/>
  <path d="M250 180 H370" stroke="#225aeb" stroke-width="3" marker-end="url(#a)"/>
  <text x="320" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#1a1a1a">High concentration ’ low concentration</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#225aeb"/>
    </marker>
  </defs>
</svg>
