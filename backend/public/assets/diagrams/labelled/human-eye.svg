<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Human eye labelled diagram">
  <rect width="640" height="400" fill="#f7f5f1"/>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Structure of the Human Eye (label the parts)</text>

  <!-- Eye eyeball outer wall (Sclera) -->
  <path d="M220 110 A 130 130 0 1 1 220 290 A 100 100 0 0 1 220 110" fill="#fff" stroke="#374151" stroke-width="3"/>

  <!-- Cornea (bulging transparent front) -->
  <path d="M220 110 C 160 150 160 250 220 290" fill="none" stroke="#38bdf8" stroke-width="5"/>

  <!-- Iris & Pupil -->
  <line x1="225" y1="115" x2="235" y2="165" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <line x1="225" y1="285" x2="235" y2="235" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Lens -->
  <ellipse cx="255" cy="200" rx="14" ry="32" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>

  <!-- Retina (inner back lining) -->
  <path d="M260 95 A 115 115 0 0 1 455 200 A 115 115 0 0 1 260 305" fill="none" stroke="#f43f5e" stroke-width="4"/>

  <!-- Optic nerve -->
  <path d="M445 185 L 530 175 L 530 225 L 445 215" fill="#fef3c7" stroke="#374151" stroke-width="2"/>

  <!-- Number badges -->
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">
    <!-- 1: Cornea -->
    <circle cx="80" cy="150" r="14" fill="#1d4ed8"/><text x="80" y="155" text-anchor="middle">1</text>
    <line x1="94" y1="150" x2="175" y2="185" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 2: Iris -->
    <circle cx="80" cy="90" r="14" fill="#1d4ed8"/><text x="80" y="95" text-anchor="middle">2</text>
    <line x1="94" y1="90" x2="225" y2="135" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 3: Pupil -->
    <circle cx="80" cy="220" r="14" fill="#1d4ed8"/><text x="80" y="225" text-anchor="middle">3</text>
    <line x1="94" y1="220" x2="230" y2="200" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 4: Lens -->
    <circle cx="255" cy="360" r="14" fill="#1d4ed8"/><text x="255" y="365" text-anchor="middle">4</text>
    <line x1="255" y1="346" x2="255" y2="235" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 5: Retina -->
    <circle cx="560" cy="110" r="14" fill="#1d4ed8"/><text x="560" y="115" text-anchor="middle">5</text>
    <line x1="546" y1="110" x2="420" y2="130" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 6: Optic nerve -->
    <circle cx="560" cy="200" r="14" fill="#1d4ed8"/><text x="560" y="205" text-anchor="middle">6</text>
    <line x1="546" y1="200" x2="480" y2="200" stroke="#1d4ed8" stroke-width="2"/>
  </g>
</svg>
