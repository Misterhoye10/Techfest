<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Flower anatomy labelled diagram">
  <rect width="640" height="400" fill="#f7f5f1"/>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Flower Structure (label the parts)</text>

  <!-- Stem & Receptacle -->
  <line x1="320" y1="310" x2="320" y2="380" stroke="#15803d" stroke-width="8"/>
  <ellipse cx="320" cy="310" rx="35" ry="15" fill="#16a34a"/>

  <!-- Sepals -->
  <path d="M290 310 Q 240 315 230 280 Q 280 295 295 305" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <path d="M350 310 Q 400 315 410 280 Q 360 295 345 305" fill="#22c55e" stroke="#15803d" stroke-width="2"/>

  <!-- Petals -->
  <path d="M250 290 C 180 220 180 120 270 140 C 290 200 280 260 270 290" fill="#fbcfe8" stroke="#db2777" stroke-width="2.5"/>
  <path d="M390 290 C 460 220 460 120 370 140 C 350 200 360 260 370 290" fill="#fbcfe8" stroke="#db2777" stroke-width="2.5"/>
  <path d="M320 290 C 260 180 260 70 320 60 C 380 70 380 180 320 290" fill="#f472b6" stroke="#be185d" stroke-width="2.5" opacity="0.6"/>

  <!-- Pistil / Carpel (Female) -->
  <!-- Ovary -->
  <ellipse cx="320" cy="270" rx="28" ry="32" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <!-- Style -->
  <line x1="320" y1="238" x2="320" y2="125" stroke="#16a34a" stroke-width="5"/>
  <!-- Stigma -->
  <ellipse cx="320" cy="120" rx="14" ry="8" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>

  <!-- Stamens (Male) -->
  <!-- Left Filament & Anther -->
  <path d="M305 280 Q 240 230 260 140" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
  <ellipse cx="260" cy="135" rx="8" ry="12" fill="#eab308" stroke="#a16207" stroke-width="2"/>

  <!-- Right Filament & Anther -->
  <path d="M335 280 Q 400 230 380 140" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
  <ellipse cx="380" cy="135" rx="8" ry="12" fill="#eab308" stroke="#a16207" stroke-width="2"/>

  <!-- Number badges -->
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">
    <!-- 1: Petal -->
    <circle cx="100" cy="150" r="14" fill="#1d4ed8"/><text x="100" y="155" text-anchor="middle">1</text>
    <line x1="114" y1="150" x2="220" y2="180" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 2: Sepal -->
    <circle cx="100" cy="300" r="14" fill="#1d4ed8"/><text x="100" y="305" text-anchor="middle">2</text>
    <line x1="114" y1="300" x2="245" y2="295" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 3: Anther -->
    <circle cx="540" cy="135" r="14" fill="#1d4ed8"/><text x="540" y="140" text-anchor="middle">3</text>
    <line x1="526" y1="135" x2="392" y2="135" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 4: Stigma -->
    <circle cx="320" cy="65" r="14" fill="#1d4ed8"/><text x="320" y="70" text-anchor="middle">4</text>
    <line x1="320" y1="79" x2="320" y2="110" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 5: Ovary -->
    <circle cx="540" cy="270" r="14" fill="#1d4ed8"/><text x="540" y="275" text-anchor="middle">5</text>
    <line x1="526" y1="270" x2="352" y2="270" stroke="#1d4ed8" stroke-width="2"/>
  </g>
</svg>
