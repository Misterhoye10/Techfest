<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Simple electric circuit diagram">
  <rect width="640" height="400" fill="#f7f5f1"/>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Electric Circuit Components (label the parts)</text>

  <!-- Circuit wire rectangle -->
  <path d="M160 120 L 480 120 L 480 300 L 160 300 Z" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- 1: Battery / Cell (Top side) -->
  <rect x="290" y="105" width="60" height="30" fill="#f7f5f1"/> <!-- mask wire -->
  <line x1="305" y1="100" x2="305" y2="140" stroke="#dc2626" stroke-width="4"/> <!-- Long positive -->
  <line x1="320" y1="110" x2="320" y2="130" stroke="#1e293b" stroke-width="8"/> <!-- Short negative -->
  <text x="295" y="95" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#dc2626">+</text>
  <text x="328" y="95" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#1e293b">-</text>

  <!-- 2: Switch (Right side) -->
  <rect x="465" y="180" width="30" height="50" fill="#f7f5f1"/> <!-- mask wire -->
  <circle cx="480" cy="190" r="5" fill="#1e293b"/>
  <circle cx="480" cy="225" r="5" fill="#1e293b"/>
  <line x1="480" y1="225" x2="495" y2="195" stroke="#2563eb" stroke-width="4"/> <!-- open lever -->

  <!-- 3: Resistor (Bottom side) -->
  <rect x="270" y="285" width="100" height="30" fill="#f7f5f1"/> <!-- mask wire -->
  <rect x="285" y="290" width="70" height="20" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>

  <!-- 4: Ammeter (Left side) -->
  <rect x="145" y="185" width="30" height="50" fill="#f7f5f1"/> <!-- mask wire -->
  <circle cx="160" cy="210" r="22" fill="#fff" stroke="#1e293b" stroke-width="3"/>
  <text x="160" y="217" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="bold" fill="#1e293b">A</text>

  <!-- Number badges -->
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">
    <!-- 1: Battery -->
    <circle cx="312" cy="50" r="14" fill="#1d4ed8"/><text x="312" y="55" text-anchor="middle">1</text>
    <line x1="312" y1="64" x2="312" y2="92" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 2: Switch -->
    <circle cx="560" cy="210" r="14" fill="#1d4ed8"/><text x="560" y="215" text-anchor="middle">2</text>
    <line x1="546" y1="210" x2="498" y2="210" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 3: Resistor -->
    <circle cx="320" cy="365" r="14" fill="#1d4ed8"/><text x="320" y="370" text-anchor="middle">3</text>
    <line x1="320" y1="351" x2="320" y2="315" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 4: Ammeter -->
    <circle cx="80" cy="210" r="14" fill="#1d4ed8"/><text x="80" y="215" text-anchor="middle">4</text>
    <line x1="94" y1="210" x2="135" y2="210" stroke="#1d4ed8" stroke-width="2"/>
  </g>
</svg>
