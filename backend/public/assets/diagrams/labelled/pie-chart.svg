<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Pie chart labelled diagram">
  <rect width="640" height="400" fill="#f7f5f1"/>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Pie chart - labelled parts</text>

  <circle cx="260" cy="210" r="110" fill="#93c5fd"/>
  <path d="M260 210 L260 100 A110 110 0 0 1 355 270 Z" fill="#1d4ed8"/>
  <path d="M260 210 L355 270 A110 110 0 0 1 170 270 Z" fill="#fb735b"/>
  <circle cx="260" cy="210" r="4" fill="#1a1a1a"/>
  <line x1="260" y1="210" x2="260" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="430" y="150" width="150" height="100" rx="10" fill="#fff" stroke="#e5e2df"/>
  <rect x="445" y="168" width="14" height="14" fill="#1d4ed8"/>
  <text x="468" y="180" font-family="system-ui,sans-serif" font-size="13" fill="#1a1a1a">Category A</text>
  <rect x="445" y="192" width="14" height="14" fill="#fb735b"/>
  <text x="468" y="204" font-family="system-ui,sans-serif" font-size="13" fill="#1a1a1a">Category B</text>
  <rect x="445" y="216" width="14" height="14" fill="#93c5fd"/>
  <text x="468" y="228" font-family="system-ui,sans-serif" font-size="13" fill="#1a1a1a">Category C</text>

  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">
    <circle cx="120" cy="210" r="14" fill="#1d4ed8"/><text x="120" y="215" text-anchor="middle">1</text>
    <line x1="134" y1="210" x2="256" y2="210" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="200" cy="90" r="14" fill="#1d4ed8"/><text x="200" y="95" text-anchor="middle">2</text>
    <line x1="200" y1="104" x2="260" y2="150" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="360" cy="150" r="14" fill="#1d4ed8"/><text x="360" y="155" text-anchor="middle">3</text>
    <line x1="346" y1="155" x2="310" y2="170" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="360" cy="280" r="14" fill="#1d4ed8"/><text x="360" y="285" text-anchor="middle">4</text>
    <line x1="346" y1="280" x2="300" y2="260" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="505" cy="120" r="14" fill="#1d4ed8"/><text x="505" y="125" text-anchor="middle">5</text>
    <line x1="505" y1="134" x2="505" y2="150" stroke="#1d4ed8" stroke-width="2"/>
  </g>

  <text x="320" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#57534e">Sector angle = (frequency / total) x 360 degrees</text>
</svg>
