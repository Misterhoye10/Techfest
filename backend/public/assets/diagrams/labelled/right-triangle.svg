<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Right-angled triangle labelled diagram">
  <rect width="640" height="400" fill="#f7f5f1"/>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Right-angled triangle - labelled parts</text>

  <path d="M160 300 L160 120 L420 300 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M160 270 L190 270 L190 300" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <text x="145" y="210" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#1a1a1a">a</text>
  <text x="290" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1a1a1a">b</text>
  <text x="310" y="190" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">c</text>

  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">
    <circle cx="120" cy="300" r="14" fill="#1d4ed8"/><text x="120" y="305" text-anchor="middle">1</text>
    <line x1="134" y1="295" x2="158" y2="285" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="480" cy="180" r="14" fill="#1d4ed8"/><text x="480" y="185" text-anchor="middle">2</text>
    <line x1="466" y1="185" x2="300" y2="210" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="100" cy="200" r="14" fill="#1d4ed8"/><text x="100" y="205" text-anchor="middle">3</text>
    <line x1="114" y1="200" x2="158" y2="200" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="300" cy="350" r="14" fill="#1d4ed8"/><text x="300" y="355" text-anchor="middle">4</text>
    <line x1="300" y1="336" x2="290" y2="302" stroke="#1d4ed8" stroke-width="2"/>
  </g>

  <text x="320" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#57534e">Pythagoras: a^2 + b^2 = c^2 (c = hypotenuse)</text>
</svg>
