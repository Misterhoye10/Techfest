<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Light refraction labelled diagram">
  <rect width="640" height="400" fill="#f7f5f1"/>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Refraction of Light (label the parts)</text>

  <!-- Air vs Glass/Water boundary -->
  <!-- Top: Air (less dense) -->
  <text x="480" y="80" font-family="system-ui,sans-serif" font-size="14" fill="#64748b">Air (less dense)</text>
  <!-- Bottom: Glass block (denser) -->
  <rect x="120" y="200" width="400" height="150" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="480" y="240" font-family="system-ui,sans-serif" font-size="14" fill="#0369a1">Glass (denser)</text>

  <!-- Boundary line -->
  <line x1="120" y1="200" x2="520" y2="200" stroke="#0284c7" stroke-width="3"/>

  <!-- Normal Line (dashed perpendicular) -->
  <line x1="320" y1="70" x2="320" y2="330" stroke="#64748b" stroke-width="2" stroke-dasharray="6"/>

  <!-- 1: Incident Ray -->
  <line x1="180" y1="80" x2="320" y2="200" stroke="#e11d48" stroke-width="3.5"/>
  <!-- Arrow on incident ray -->
  <polygon points="250,140 240,130 245,145" fill="#e11d48"/>

  <!-- 3: Refracted Ray (bends towards normal) -->
  <line x1="320" y1="200" x2="390" y2="330" stroke="#e11d48" stroke-width="3.5"/>
  <!-- Arrow on refracted ray -->
  <polygon points="355,265 365,260 355,250" fill="#e11d48"/>

  <!-- 4: Angle of incidence (arc between incident ray and normal) -->
  <path d="M 285,170 A 45,45 0 0,1 320,155" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="290" y="150" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#d97706">i</text>

  <!-- Number badges -->
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">
    <!-- 1: Incident Ray -->
    <circle cx="90" cy="110" r="14" fill="#1d4ed8"/><text x="90" y="115" text-anchor="middle">1</text>
    <line x1="104" y1="110" x2="220" y2="114" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 2: Normal -->
    <circle cx="320" cy="50" r="14" fill="#1d4ed8"/><text x="320" y="55" text-anchor="middle">2</text>
    <line x1="320" y1="64" x2="320" y2="80" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 3: Refracted Ray -->
    <circle cx="530" cy="300" r="14" fill="#1d4ed8"/><text x="530" y="305" text-anchor="middle">3</text>
    <line x1="516" y1="300" x2="370" y2="290" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 4: Angle of Incidence -->
    <circle cx="210" cy="170" r="14" fill="#1d4ed8"/><text x="210" y="175" text-anchor="middle">4</text>
    <line x1="224" y1="170" x2="285" y2="165" stroke="#1d4ed8" stroke-width="2"/>
  </g>
</svg>
