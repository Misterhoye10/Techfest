<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Animal cell labelled diagram">
  <rect width="640" height="400" fill="#f7f5f1"/>
  <text x="320" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Animal Cell Structure (label the parts)</text>

  <!-- Cell membrane & cytoplasm -->
  <ellipse cx="320" cy="210" rx="190" ry="140" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  
  <!-- Nucleus -->
  <circle cx="310" cy="200" r="50" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/>
  <circle cx="300" cy="190" r="18" fill="#4338ca"/> <!-- Nucleolus -->

  <!-- Mitochondria -->
  <ellipse cx="210" cy="170" rx="28" ry="15" fill="#fecaca" stroke="#b91c1c" stroke-width="2" transform="rotate(-25 210 170)"/>
  <path d="M195 170 Q210 160 225 170 Q210 180 195 170" fill="none" stroke="#b91c1c" stroke-width="1.5" transform="rotate(-25 210 170)"/>

  <ellipse cx="420" cy="240" rx="28" ry="15" fill="#fecaca" stroke="#b91c1c" stroke-width="2" transform="rotate(35 420 240)"/>
  <path d="M405 240 Q420 230 435 240 Q420 250 405 240" fill="none" stroke="#b91c1c" stroke-width="1.5" transform="rotate(35 420 240)"/>

  <!-- Endoplasmic reticulum / Vacuole -->
  <ellipse cx="230" cy="265" rx="22" ry="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Ribosomes (dots) -->
  <circle cx="270" cy="130" r="4" fill="#6b7280"/>
  <circle cx="285" cy="120" r="4" fill="#6b7280"/>
  <circle cx="370" cy="140" r="4" fill="#6b7280"/>
  <circle cx="390" cy="160" r="4" fill="#6b7280"/>
  <circle cx="380" cy="285" r="4" fill="#6b7280"/>
  <circle cx="360" cy="275" r="4" fill="#6b7280"/>

  <!-- Number badges -->
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">
    <!-- 1: Cell membrane -->
    <circle cx="80" cy="90" r="14" fill="#1d4ed8"/><text x="80" y="95" text-anchor="middle">1</text>
    <line x1="94" y1="90" x2="200" y2="120" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 2: Cytoplasm -->
    <circle cx="80" cy="260" r="14" fill="#1d4ed8"/><text x="80" y="265" text-anchor="middle">2</text>
    <line x1="94" y1="260" x2="180" y2="230" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 3: Nucleus -->
    <circle cx="310" cy="370" r="14" fill="#1d4ed8"/><text x="310" y="375" text-anchor="middle">3</text>
    <line x1="310" y1="356" x2="310" y2="250" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 4: Mitochondrion -->
    <circle cx="560" cy="170" r="14" fill="#1d4ed8"/><text x="560" y="175" text-anchor="middle">4</text>
    <line x1="546" y1="170" x2="448" y2="240" stroke="#1d4ed8" stroke-width="2"/>

    <!-- 5: Ribosomes -->
    <circle cx="560" cy="120" r="14" fill="#1d4ed8"/><text x="560" y="125" text-anchor="middle">5</text>
    <line x1="546" y1="120" x2="395" y2="158" stroke="#1d4ed8" stroke-width="2"/>
  </g>
</svg>
