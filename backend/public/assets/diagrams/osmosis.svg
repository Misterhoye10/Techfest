<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Osmosis diagram">
  <rect width="640" height="360" fill="#f7f5f1"/>
  <rect x="40" y="40" width="560" height="280" rx="20" fill="#fff" stroke="#e5e2df"/>
  <rect x="80" y="90" width="200" height="180" rx="12" fill="#eef2ff" stroke="#225aeb"/>
  <rect x="360" y="90" width="200" height="180" rx="12" fill="#fff5f2" stroke="#fb735b"/>
  <line x1="320" y1="90" x2="320" y2="270" stroke="#1a1a1a" stroke-width="4" stroke-dasharray="6 6"/>
  <text x="180" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#6b7280">Dilute (more water)</text>
  <text x="460" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#6b7280">Concentrated</text>
  <text x="320" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#1a1a1a" font-weight="600">Membrane  water moves ’</text>
  <path d="M250 180 H390" stroke="#225aeb" stroke-width="3" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#225aeb"/>
    </marker>
  </defs>
</svg>
