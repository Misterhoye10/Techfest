<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="pH scale">
  <rect width="640" height="360" fill="#f7f5f1"/>
  <rect x="40" y="40" width="560" height="280" rx="20" fill="#fff" stroke="#e5e2df"/>
  <text x="320" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#1a1a1a" font-weight="600">pH scale</text>
  <rect x="80" y="140" width="480" height="36" rx="8" fill="url(#ph)"/>
  <text x="100" y="210" font-family="system-ui,sans-serif" font-size="14" fill="#1a1a1a">Acid (06)</text>
  <text x="300" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1a1a1a">Neutral 7</text>
  <text x="540" y="210" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#1a1a1a">Base (814)</text>
  <text x="320" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#6b7280">Lemon H 2 � Water H 7 � Soap H 10</text>
  <defs>
    <linearGradient id="ph" x1="0" x2="1">
      <stop offset="0%" stop-color="#fb735b"/>
      <stop offset="50%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#225aeb"/>
    </linearGradient>
  </defs>
</svg>
