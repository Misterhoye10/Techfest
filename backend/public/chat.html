<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <div class="app">
      <main class="chat" aria-label="Reca">
        <header class="chat__bar">
          <div class="chat__who">
            <span class="chat__avatar" aria-hidden="true">R</span>
            <div>
              <h1>Reca</h1>
              <p id="statusLine">Online</p>
            </div>
          </div>
        </header>

        <div class="chat__thread" id="thread" role="log" aria-live="polite"></div>

        <div class="chat__suggest" id="suggestRow" aria-label="Suggested topics">
          <p class="chat__suggest-label">Try a topic</p>
          <div class="chips" id="topicChips"></div>
        </div>

        <form class="chat__composer" id="chatForm">
          <input
            id="messageInput"
            type="text"
            autocomplete="off"
            placeholder="Ask Reca about a topic…"
            enterkeyhint="send"
          />
          <button type="submit" class="chat__send" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3.5 12L20 4l-6.5 16-2.2-6.3L3.5 12z" fill="currentColor" />
            </svg>
          </button>
        </form>
      </main>
    </div>
    <script src="/chat.js"></script>
  </body>
</html>
