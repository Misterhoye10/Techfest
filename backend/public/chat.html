<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <div class="frame" id="app" data-mode="welcome">
      <aside class="side" aria-label="Reca navigation">
        <div class="side__top">
          <a class="brand" href="/" aria-label="Reca home">
            <span class="brand__mark" aria-hidden="true">R</span>
            <span class="brand__name">Reca</span>
          </a>

          <button type="button" class="side__new" id="newSessionBtn">
            <span aria-hidden="true">+</span>
            New session
          </button>

          <nav class="side__nav" aria-label="Primary">
            <button type="button" class="nav-item is-active" data-nav="revise">
              <span class="nav-item__ico" aria-hidden="true">◇</span>
              Revise
            </button>
            <button type="button" class="nav-item" data-nav="progress">
              <span class="nav-item__ico" aria-hidden="true">◎</span>
              Progress
            </button>
            <button type="button" class="nav-item" data-nav="about">
              <span class="nav-item__ico" aria-hidden="true">?</span>
              How it works
            </button>
          </nav>

          <div class="side__recent">
            <p class="side__label">Topics</p>
            <div class="side__topics" id="sideTopics"></div>
          </div>
        </div>

        <div class="side__foot">
          <div class="side__user">
            <span class="side__avatar" aria-hidden="true">S</span>
            <div>
              <p class="side__user-name">Student</p>
              <p class="side__user-meta" id="statusLine">Online</p>
            </div>
          </div>
        </div>
      </aside>

      <section class="main" aria-label="Reca workspace">
        <header class="main__bar">
          <div>
            <p class="main__eyebrow" id="mainEyebrow">WAEC &amp; JAMB</p>
            <h1 class="main__title" id="mainTitle">Ready to revise?</h1>
          </div>
          <button type="button" class="main__menu-mobile" id="mobileMenuBtn" aria-label="Open menu">
            Menu
          </button>
        </header>

        <div class="main__body">
          <div class="welcome" id="welcome">
            <p class="welcome__sub">
              I’ll explain simply, ask two quick questions, and come back later if you miss something.
            </p>
          </div>

          <div class="thread" id="thread" role="log" aria-live="polite" hidden></div>
        </div>

        <div class="main__dock">
          <div class="chips" id="topicChips" aria-label="Suggested topics"></div>
          <form class="composer" id="chatForm">
            <input
              id="messageInput"
              type="text"
              autocomplete="off"
              placeholder="Ask about a topic…"
              enterkeyhint="send"
            />
            <button type="submit" class="composer__send" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3.5 12L20 4l-6.5 16-2.2-6.3L3.5 12z" fill="currentColor" />
              </svg>
            </button>
          </form>
        </div>
      </section>
    </div>
    <script src="/chat.js"></script>
  </body>
</html>
