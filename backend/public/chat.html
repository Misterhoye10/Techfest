<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <div class="app" id="app" data-mode="welcome">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__mark" aria-hidden="true">R</span>
          <span class="topbar__name">Reca</span>
        </div>
        <p class="topbar__status" id="statusLine">Online</p>
      </header>

      <section class="welcome" id="welcome" aria-label="Welcome">
        <p class="welcome__eyebrow">WAEC &amp; JAMB</p>
        <h1 class="welcome__title">Ready to revise?</h1>
        <p class="welcome__sub">
          I’ll explain simply, ask two quick questions, and come back later if you miss something.
        </p>
      </section>

      <main class="stage" aria-label="Reca chat">
        <div class="thread" id="thread" role="log" aria-live="polite" hidden></div>

        <div class="dock">
          <form class="composer" id="chatForm">
            <input
              id="messageInput"
              type="text"
              autocomplete="off"
              placeholder="Ask about a topic — e.g. explain photosynthesis"
              enterkeyhint="send"
            />
            <button type="submit" class="composer__send" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3.5 12L20 4l-6.5 16-2.2-6.3L3.5 12z" fill="currentColor" />
              </svg>
            </button>
          </form>

          <div class="suggest" id="suggestRow">
            <div class="chips" id="topicChips"></div>
          </div>
        </div>
      </main>
    </div>
    <script src="/chat.js"></script>
  </body>
</html>
