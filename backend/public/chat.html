<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <div class="shell">
      <div class="app" id="app" data-mode="welcome">
        <header class="topbar">
          <a class="topbar__brand" href="/" aria-label="Reca home">
            <span class="topbar__mark" aria-hidden="true">R</span>
            <span class="topbar__name">Reca</span>
          </a>

          <div class="topbar__right">
            <span class="pill" id="statusLine">
              <span class="pill__dot" aria-hidden="true"></span>
              Online
            </span>

            <div class="menu">
              <button
                type="button"
                class="menu__btn"
                id="menuBtn"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="menuPanel"
              >
                Menu
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              </button>
              <div class="menu__panel" id="menuPanel" role="menu" hidden>
                <button type="button" class="menu__item" role="menuitem" data-action="progress">
                  How am I doing?
                </button>
                <button type="button" class="menu__item" role="menuitem" data-action="topics">
                  Suggested topics
                </button>
                <button type="button" class="menu__item" role="menuitem" data-action="about">
                  How Reca works
                </button>
                <div class="menu__rule" aria-hidden="true"></div>
                <button type="button" class="menu__item" role="menuitem" data-action="new">
                  New session
                </button>
              </div>
            </div>
          </div>
        </header>

        <section class="welcome" id="welcome" aria-label="Welcome">
          <p class="welcome__eyebrow">WAEC &amp; JAMB study companion</p>
          <h1 class="welcome__title">Ready to revise?</h1>
          <p class="welcome__sub">
            Explain a topic. Answer two quick checks. Reca remembers what you miss and brings it back.
          </p>
        </section>

        <main class="stage" aria-label="Reca chat">
          <div class="thread" id="thread" role="log" aria-live="polite" hidden></div>

          <div class="dock">
            <form class="composer" id="chatForm">
              <input
                id="messageInput"
                type="text"
                autocomplete="off"
                placeholder="Ask about a topic — e.g. explain photosynthesis"
                enterkeyhint="send"
              />
              <button type="submit" class="composer__send" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3.5 12L20 4l-6.5 16-2.2-6.3L3.5 12z" fill="currentColor" />
                </svg>
              </button>
            </form>

            <div class="suggest" id="suggestRow">
              <p class="suggest__label" id="topicsLabel">Start with</p>
              <div class="chips" id="topicChips"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="/chat.js"></script>
  </body>
</html>
